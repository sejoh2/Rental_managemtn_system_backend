# GitHub's own security scan of the code (free for public repositories).
# Findings appear under the repository's Security tab.
name: CodeQL

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  schedule:
    # Every Monday at 06:00 Nairobi time, to catch newly known problems.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
