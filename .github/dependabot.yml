# Opens pull requests into the test branch when dependencies have updates or
# security fixes. They go through CI like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: monthly
