openapi: 3.0.3

info:
  title: Kodi Rental Management API
  version: 1.0.0
  description: |
    Backend API for Kodi Rental Management System.

    Recommended implementation order:
    1. Authentication
    2. Admin owner promotion
    3. Property and M-Pesa account setup
    4. Units and tenants
    5. Payments and M-Pesa C2B callbacks
    6. Water billing
    7. Agreements
    8. Expenses and maintenance
    9. Caretakers
    10. SMS Centre
    11. Reports
    12. Settings

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
  - name: Step 1 - Authentication
  - name: Step 2 - Admin users
  - name: Kodi billing
  - name: Step 3 - Properties and M-Pesa
  - name: Step 4 - Units
  - name: Step 5 - Tenants
  - name: Step 6 - Payments
  - name: Step 7 - Water billing
  - name: Step 8 - Agreements
  - name: Step 9 - Expenses
  - name: Service charges
  - name: Electricity bills
  - name: Deposit reconciliation
  - name: Step 10 - Maintenance
  - name: Step 11 - Caretakers
  - name: Step 12 - SMS Centre
  - name: Step 13 - Reports
  - name: Step 14 - Settings
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Health]
      summary: Check backend health
      responses:
        "200":
          description: Backend is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/request-otp:
    post:
      tags: [Step 1 - Authentication]
      summary: Request OTP sign-in code
      description: |
        Creates an OTP request. New verified phone numbers become normal `user` accounts.
        Limited to five requests per 15 minutes per client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/auth/verify-otp:
    post:
      tags: [Step 1 - Authentication]
      summary: Verify OTP and authenticate
      description: |
        Returns an access token and refresh token. A new phone becomes a normal `user`;
        an admin can later promote that user to `owner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/auth/refresh-token:
    post:
      tags: [Step 1 - Authentication]
      summary: Refresh access token
      description: |
        Each sign-in is a session (a row of refresh_tokens). Both tokens
        carry its ID (`sid`), the issuer `rental-api` and the audience
        `rental-app-<NODE_ENV>` (or JWT_AUDIENCE). Every request checks that
        the session is still open, so signing out, or an administrator
        ending a user's sessions, takes effect on the next request.

        Renewing swaps the refresh token for a new one in the same session,
        in one step: a refresh token works once. Tokens from another
        installation or database are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/logout:
    post:
      tags: [Step 1 - Authentication]
      summary: Log out and revoke refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/auth/me:
    get:
      tags: [Step 1 - Authentication]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/me/name:
    patch:
      tags: [Step 1 - Authentication]
      summary: Set the signed-in person's name
      description: |
        An account created by OTP is called "New User" and its
        `needs_name` is true until the person gives their name here.
        The first word becomes the first name and the last word the last
        name, so a middle name is dropped; one word leaves the last name
        empty. Allowed only while
        `needs_name` is true (409 afterwards; an owner changes their name
        in Settings). Written to the audit log as PROFILE_NAME_SET.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Joseph Kamau
      responses:
        "200":
          description: Name saved; returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/subscriptions:
    get:
      tags: [Kodi billing]
      summary: The owner's Kodi plan, bills and payments
      description: |
        Owners only (and the admin inside an owner's account). `status`
        (state trial, active, grace or read_only; covered_until,
        grace_ends_on, monthly_price), `open_invoice`, enabled prepaid
        `plans` with their price, `invoices`, `payments`, `discount`,
        `pending_payment` and `sign_in_phone`. Amounts are whole
        shillings. A read-only account can still read, download and
        pay; every other change is refused with 403 and
        `code: account_read_only` (owners and their caretakers).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/subscriptions/pay:
    post:
      tags: [Kodi billing]
      summary: Send the M-Pesa prompt to pay Kodi
      description: |
        STK push (Buy Goods) to Kodi's till for the open bill, or for a
        prepaid plan (`plan_months`). The amount always comes from the
        bill. `phone` defaults to the owner's sign-in phone. One prompt
        per 90 seconds and 3 per 10 minutes per owner. 503 when Kodi's
        till is not set up on the server.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                phone:
                  type: string
                  example: "0712345678"
                plan_months:
                  type: integer
                  nullable: true
                  example: 6
      responses:
        "200":
          description: Prompt sent; `stk_id` to follow it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/subscriptions/payment-requests/{stk_id}:
    get:
      tags: [Kodi billing]
      summary: How a prompt ended
      description: sent, confirming, paid, failed, cancelled or expired.
      security:
        - bearerAuth: []
      parameters:
        - name: stk_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/subscriptions/receipts/{payment_id}:
    get:
      tags: [Kodi billing]
      summary: Receipt PDF for one of the owner's payments
      security:
        - bearerAuth: []
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF (not cached)
        "404":
          description: Not this owner's payment

  /api/subscriptions/stk-result/{secret}:
    post:
      tags: [Kodi billing]
      summary: Safaricom's STK result (public)
      description: |
        Called by Safaricom only; the secret is KODI_MPESA_RESULT_SECRET
        (a wrong one answers 404). Always answers `{ ResultCode: 0 }`;
        a payment counts only for a request Kodi made, with the same
        amount, an unused receipt, and after Safaricom confirms it
        (STK Query).
      responses:
        "200":
          description: Accepted

  /api/admin/billing:
    get:
      tags: [Kodi billing]
      summary: Admin billing page
      description: |
        Admin only. `settings` (monthly_price, grace_days), all `plans`,
        every owner's state in `accounts`, and whether M-Pesa is set up.
        Admin changes (all need `reason`, all audited with before and
        after): PUT /settings, PUT /plans/{months},
        GET /owners/{owner_id}, POST /owners/{owner_id}/extend-trial,
        /free-months, /discounts, /request-payment,
        POST /discounts/{discount_id}/end,
        PUT /invoices/{invoice_id}/amount (lower only; the rest
        `forgive` or `carry` to the next bill),
        POST /invoices/{invoice_id}/payments (cash, bank, other; the
        bill's full amount), GET /receipts/{payment_id}.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/overview:
    get:
      tags: [Step 2 - Admin users]
      summary: Platform overview for the admin
      description: |
        Admin only. `totals` across the platform and one row per owner
        account in `owners`: properties, units, current tenants,
        caretakers, payments matched this month and SMS accepted this
        month with their cost. Months are Kenyan time.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/owners/{owner_id}/open:
    post:
      tags: [Step 2 - Admin users]
      summary: Open an owner's account as admin
      description: |
        Admin only. Records ADMIN_OPENED_ACCOUNT in the audit log and
        returns the owner. To then work inside that account, the admin
        sends the header `X-Acting-Owner-Id: <owner_id>` on any owner
        endpoint: the request runs as that owner, with every owner
        permission, and each change is audited with the admin as the
        actor, the owner as the account and `by_admin: true` in the
        metadata. The header is ignored on /api/auth, /api/users and
        /api/admin, and for anyone who is not an admin.
      security:
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The owner whose account was opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/owners/{owner_id}:
    get:
      tags: [Step 2 - Admin users]
      summary: One owner account, read-only
      description: |
        Admin only. The owner, totals (including money collected this
        month and what tenants owe), their properties, caretakers and the
        latest audit entries of the account.
      security:
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Owner account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/notifications:
    get:
      tags: [Step 2 - Admin users]
      summary: What is waiting for the admin
      description: |
        Admin only. Sender IDs waiting for approval, people waiting to be
        made an owner, and sign-in activity in the last 24 hours that
        looks like guessing: 5 or more wrong codes for one number
        (`failed_sign_ins`), 8 or more codes requested for one number
        (`code_requests`), or any wrong code for the admin's own number
        (`admin_sign_in_failed`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/system:
    get:
      tags: [Step 2 - Admin users]
      summary: Safe facts about the server setup
      description: |
        Admin only. SMS mode, whether the SMS provider account is set,
        the default sender ID, sign-in code rules, and whether the payment
        callback address is HTTPS. Never returns a key, secret, password
        or database address.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/sms-usage:
    get:
      tags: [Step 2 - Admin users]
      summary: SMS sent this month through the platform's sender
      description: |
        Admin only. Per owner: messages, accepted, failed and cost, for
        messages sent with the platform's default sender. Messages sent
        with an owner's own approved sender ID are not included.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SMS usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/sender-ids:
    get:
      tags: [Step 2 - Admin users]
      summary: Sender IDs owners have entered
      description: |
        Admin only. An owner's own sender ID on a property is used only
        after the admin approves it; until then, and if it is rejected,
        that property's messages go from the default sender. A sender ID
        is approved once per owner. The property carries
        `sms_sender_status`: pending, approved or rejected.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sender ID requests, pending first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/sender-ids/{request_id}/review:
    post:
      tags: [Step 2 - Admin users]
      summary: Approve or reject a sender ID
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                note:
                  type: string
                  nullable: true
      responses:
        "200":
          description: The reviewed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/audit-logs/{log_id}:
    get:
      tags: [Step 2 - Admin users]
      summary: One audit entry in full
      description: |
        Admin only. `log` is the entry with its actor, account, record,
        details and IP address. `related` holds up to 30 other entries
        about the same record, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The entry and related entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/audit-logs/export:
    get:
      tags: [Step 2 - Admin users]
      summary: Download the audit log as CSV
      description: |
        Admin only. Same filters as the list, up to 5,000 rows, newest
        first. The download is itself audited as AUDIT_LOG_EXPORTED.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV file

  /api/users/{user_id}/demote-owner:
    post:
      tags: [Step 2 - Admin users]
      summary: Turn an owner back into a normal user
      description: |
        Admin only. Refused with 409 while the owner still has
        properties; deactivate such an account instead.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The user, now with the role user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/files:
    get:
      tags: [Files]
      summary: Files attached to a record
      description: |
        Owner, or a caretaker assigned to the record's property.
        A caretaker may list, upload and open files; tenant documents
        need level 2; deleting a file is owner only. A file a caretaker
        uploads carries them as `uploaded_by`.
        `kind` is tenant_document, expense_receipt or
        meter_photo, and `target_id` is the tenant, expense or water
        reading. The record must belong to the owner.
        GET /api/files/counts?kind=...&target_ids=1,2,3 returns how many
        files each record has.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [tenant_document, expense_receipt, meter_photo]
        - name: target_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Files, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
    post:
      tags: [Files]
      summary: Upload a file
      description: |
        Owner only. The request body is the file itself and the
        Content-Type header is its type: JPG, PNG, WEBP or PDF, up to
        5 MB, at most 20 files per record. The first bytes of the file
        must match its type. `kind`, `target_id`, `name` (the file's
        own name) and an optional `label` go in the query.
        Files are kept in private storage. To open one, call
        GET /api/files/{file_id}/link, which returns a link valid for
        5 minutes; DELETE /api/files/{file_id} removes it. Uploading,
        opening and deleting are written to the audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/{property_id}/reminders:
    get:
      tags: [Step 12 - SMS Centre]
      summary: Automatic payment reminder settings of a property
      description: |
        Owner only. Reminders are off until the owner switches them on
        for a property. `days_before` lists the days before the rent due
        day on which a reminder is sent (0 is the due day), `hour` is the
        hour in Kenya (6 to 20). A reminder goes only to a tenant who owes
        something at that moment and carries everything they owe.
        `late_enabled` adds one notice `late_days_after` days after the
        due day, to tenants who still have a bill past its due date.
        Each reminder is sent once per tenant and appears in the SMS
        centre like any other message.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Reminder settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
    put:
      tags: [Step 12 - SMS Centre]
      summary: Save a property's automatic payment reminder settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, days_before, hour, late_enabled, late_days_after]
              properties:
                enabled: { type: boolean }
                days_before:
                  type: array
                  items: { type: integer, enum: [0, 1, 2, 3, 5, 7] }
                hour: { type: integer, minimum: 6, maximum: 20 }
                late_enabled: { type: boolean }
                late_days_after: { type: integer, enum: [1, 2, 3, 5, 7, 14] }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/users:
    post:
      tags: [Step 2 - Admin users]
      summary: Add an owner by name and phone number
      description: |
        Admin only. Body: `full_name`, `phone`. The person signs in with
        that number; nothing is sent to them. There is exactly one
        administrator, the ADMIN_PHONE set on the server: no endpoint can
        create another, and PATCH /api/users/{user_id} (`full_name`,
        `phone`) refuses to change the administrator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, phone]
              properties:
                full_name: { type: string, example: Joseph Kamau }
                phone: { type: string, example: "0712345678" }
      responses:
        "201":
          description: Owner added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
    get:
      tags: [Step 2 - Admin users]
      summary: List all users
      description: Admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/users/{user_id}:
    get:
      tags: [Step 2 - Admin users]
      summary: Get user by ID
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/users/{user_id}/promote-owner:
    post:
      tags: [Step 2 - Admin users]
      summary: Promote normal user to owner
      description: |
        Admin only. Target must be an active normal `user`.
        A person cannot self-register as an owner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/users/{user_id}/deactivate:
    post:
      tags: [Step 2 - Admin users]
      summary: Deactivate user
      description: Admin only. Revokes their refresh-token sessions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/users/{user_id}/activate:
    post:
      tags: [Step 2 - Admin users]
      summary: Activate inactive or suspended user
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/admin/audit-logs:
    get:
      tags: [Step 2 - Admin users]
      summary: List the audit log across all owner accounts
      description: |
        Admin only. Each entry names the person who acted (`actor`) and the owner
        account it happened in (`account`). Automatic entries have no actor.
      security:
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: query
          description: Only entries belonging to this owner account.
          schema: { type: integer }
        - name: user_id
          in: query
          description: Only entries performed by this user.
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string, example: MANUAL_PAYMENT_RECORDED }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Audit entries, newest first, with the total matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/audit-logs/actions:
    get:
      tags: [Step 2 - Admin users]
      summary: List the action names present in the audit log
      description: Admin only. Used to fill the action filter.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Action names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/c2b/validation/{callback_token}:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Daraja C2B validation callback
      description: |
        Public callback called by Safaricom Daraja. No bearer token.
        `callback_token` is the payment account's secret (64 hex
        characters), set when its addresses are registered.
      parameters:
        - name: callback_token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DarajaC2BCallback"
      responses:
        "200":
          description: Accepted by Kodi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DarajaAcceptedResponse"

  /api/properties/c2b/confirmation/{callback_token}:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Daraja C2B confirmation callback
      description: |
        Public callback called by Safaricom Daraja after a payment.
        Recorded only when `callback_token` is the secret kept for the
        active account with the notice's BusinessShortCode (otherwise
        404, audited MPESA_CALLBACK_REFUSED). Optional allow-list of
        Safaricom addresses: MPESA_CALLBACK_ALLOWED_IPS. The backend
        identifies the property account, matches tenant payment phone,
        creates a payment, and applies money deposit-first. The old
        `/api/properties/c2b/confirmation` without a secret answers
        but records nothing (unless MPESA_C2B_ALLOW_LEGACY_CALLBACKS=true).
      parameters:
        - name: callback_token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DarajaC2BCallback"
      responses:
        "200":
          description: Accepted by Kodi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DarajaAcceptedResponse"

  /api/properties/payment-accounts/connect:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Validate M-Pesa account credentials before property creation
