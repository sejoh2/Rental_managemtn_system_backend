      summary: List expenses
      description: |
        Each expense carries `recovery`: who carries the cost. `status` is
        `owner_cost` (not charged to a tenant), `recovered` (charged and
        paid in full), `pending` (charged, not fully paid) or `at_move_out`
        (charged, to be deducted from the deposit at move-out), with
        `tenant_name`, `charged`, `paid`, `pending` and `owner_cost`.
        Only a repair from a maintenance request can be charged to a tenant.
      security:
