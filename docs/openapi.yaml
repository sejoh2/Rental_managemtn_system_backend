      responses:
        "200":
          description: Caretaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    patch:
      tags: [Step 11 - Caretakers]
      summary: Update a caretaker's name, phone number or sign-in status
      description: |
        Owner only.
        `status: suspended` stops the caretaker signing in but keeps their
        properties; `status: active` lifts it. Changing `phone` changes the
        number they sign in with and signs them out; it is refused (409) if
        the number belongs to another user. One caretaker may be assigned to
        several properties with `POST /api/properties/{property_id}/caretaker`.
        Written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaretakerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide at least one field.
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string, example: "0733908771" }
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        "200":
          description: Caretaker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
        "409":
          description: The phone number belongs to another user

  /api/properties/{property_id}/caretaker:
    post:
      tags: [Step 11 - Caretakers]
      summary: Assign or replace property caretaker
      description: |
        If the phone number has no account yet, one is created here; the caretaker
        then signs in with the normal OTP flow. An existing account must be a normal
        user or already one of this owner's caretakers.
        Each property has one active caretaker. This assigns Level 1 or Level 2 access.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCaretakerRequest"
      responses:
        "201":
          description: Caretaker assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    patch:
      tags: [Step 11 - Caretakers]
      summary: Update, suspend, or reactivate property caretaker
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaretakerRequest"
      responses:
        "200":
          description: Caretaker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/stats:
    get:
      tags: [Step 12 - SMS Centre]
      summary: Get SMS Centre statistics
      description: |
        Counts for the current month in Kenyan time. `accepted` means the
        SMS provider accepted the message; delivery to the handset is not
        tracked. `next_scheduled_at` is the next scheduled broadcast, and
        `sms_mode` is `console` when messages are only printed in the
        backend terminal and do not reach a phone.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SMS statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/recipients/estimate:
    post:
      tags: [Step 12 - SMS Centre]
      summary: Estimate SMS recipients and cost
      description: |
        Uses real tenant balances and credits. Tenants who are active or have
        given notice are included. `estimated_cost` assumes one SMS per
        tenant; a message over 160 characters is billed as more.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsRecipientTarget"
      responses:
        "200":
          description: Recipient count and estimated cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/templates:
    get:
      tags: [Step 12 - SMS Centre]
      summary: List saved SMS templates
      description: |
        The first time an owner's templates are listed they receive four
        starter templates, which they may edit or delete.
        Placeholders: {name}, {house}, {property}, {balance}, {amount},
        {month}, {due_date} (as 5 Oct 2026) and {days_overdue}.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    post:
      tags: [Step 12 - SMS Centre]
      summary: Create SMS template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsTemplateRequest"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/templates/{template_id}:
    patch:
      tags: [Step 12 - SMS Centre]
      summary: Update SMS template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsTemplateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    delete:
      tags: [Step 12 - SMS Centre]
      summary: Delete SMS template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Template deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/sms/broadcasts:
    get:
      tags: [Step 12 - SMS Centre]
      summary: List SMS broadcasts
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, sending, completed, partially_failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Broadcasts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    post:
      tags: [Step 12 - SMS Centre]
      summary: Create immediate or scheduled broadcast
      description: |
        Without `send_at` the messages are written and sent now. With
        `send_at` only the selection is stored: the recipients and their
        balances are worked out when the broadcast is sent, so
        `recipient_count` is 0 until then. If nobody matches at that time
        the broadcast completes with no messages.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSmsBroadcastRequest"
      responses:
        "201":
          description: Broadcast queued or scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/broadcasts/{broadcast_id}/cancel:
    post:
      tags: [Step 12 - SMS Centre]
      summary: Cancel scheduled broadcast
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BroadcastId"
      responses:
        "200":
          description: Broadcast cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/messages:
    get:
      tags: [Step 12 - SMS Centre]
      summary: List individual SMS message records
      description: |
        Includes single messages the system sends outside a broadcast, such
        as a repair charge notice; those have `broadcast_id: null`.
      security:
        - bearerAuth: []
      parameters:
        - name: property_id
          in: query
          schema:
            type: integer
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, accepted, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: SMS records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/messages/{message_id}/retry:
    post:
      tags: [Step 12 - SMS Centre]
      summary: Retry failed SMS message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SmsMessageId"
      responses:
        "200":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/reports/dashboard:
    get:
      tags: [Step 13 - Reports]
      summary: Get dashboard report
      description: |
        Periods and dates are in Kenyan time. `collection` holds income by
        kind (rent, water, electricity, service charges, repairs and
        deductions) with `total_income`, using the same definition as
        `/api/expenses/summary`; deposits are listed separately and are not
        income. `arrears` separates what current tenants owe
        (`total_arrears`) from what former tenants still owe
        (`total_former_arrears`). Archived properties are left out.
        Owners may request all their properties or one property.
        Caretakers must provide their assigned `property_id`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportPropertyId"
        - $ref: "#/components/parameters/ReportPeriod"
      responses:
        "200":
          description: Occupancy, arrears, collection, water, expense, and SMS data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/reports/export:
    get:
      tags: [Step 13 - Reports]
      summary: Export report as PDF or CSV
      description: |
        Holds the totals for the chosen type and a line per tenant under
        them: rent billed and paid per tenant, each water bill, and each
        tenant who owes money. The export is written to the audit log, and
        CSV cells that a spreadsheet would read as a formula are neutralised.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            default: full_monthly_summary
            enum: [full_monthly_summary, rent_collection, water_billing, occupancy_arrears, sms_usage]
        - $ref: "#/components/parameters/ReportPropertyId"
        - $ref: "#/components/parameters/ReportPeriod"
        - name: format
          in: query
          schema:
            type: string
            default: pdf
            enum: [pdf, csv]
      responses:
        "200":
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary

  /api/reports/tenants/{tenant_id}/statement:
    get:
      tags: [Step 13 - Reports]
      summary: Get tenant statement data
      description: |
        Includes `deposit_settlement` once a moved-out tenant's deposits
        have been reconciled, otherwise null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReportPeriod"
      responses:
        "200":
          description: Tenant charges, payments, balance, and credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/reports/tenants/{tenant_id}/statement/download:
    get:
      tags: [Step 13 - Reports]
      summary: Download tenant statement PDF
      description: The download is written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReportPeriod"
      responses:
        "200":
          description: PDF statement
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/settings:
    get:
      tags: [Step 14 - Settings]
      summary: Get owner profile, defaults, and notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/profile:
    patch:
      tags: [Step 14 - Settings]
      summary: Update owner profile
      description: |
        Phone is not editable here because it is the OTP login identity.
        Changing a phone requires a future OTP-confirmed phone-change flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/defaults:
    patch:
      tags: [Step 14 - Settings]
      summary: Update owner defaults
      description: Default rent due day affects future setup; existing property settings remain separate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDefaultsRequest"
      responses:
        "200":
          description: Defaults updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/notifications:
    patch:
      tags: [Step 14 - Settings]
      summary: Update notification preferences
      description: Stores preferences. Automation delivery must be separately enabled by scheduled jobs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesRequest"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/audit-logs:
    get:
      tags: [Step 14 - Settings]
      summary: List owner and caretaker audit activity
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/properties/{property_id}:
    get:
      tags: [Step 14 - Settings]
      summary: Get property settings context
      description: |
        Returns real property, unit summary, payment-account, and caretaker context.
        Water rules and payment accounts remain managed through their existing endpoints.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property settings context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    PropertyId:
      name: property_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    PaymentAccountId:
      name: payment_account_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    UnitId:
      name: unit_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ReadingId:
      name: reading_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    AgreementId:
      name: agreement_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ExpenseId:
      name: expense_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ServiceChargeId:
      name: service_charge_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    MaintenanceRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    CaretakerId:
      name: caretaker_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    BroadcastId:
      name: broadcast_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    SmsMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ReportPropertyId:
      name: property_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1

    ReportPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        default: this_month
        enum: [this_month, last_month, last_3_months, last_6_months, this_year]

    ExpenseFilters:
      name: property_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1

  responses:
    UnauthorizedError:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ForbiddenError:
      description: User lacks the required role or property permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request data is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    RateLimitError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: string, example: healthy }
        message: { type: string, example: Rental Management Backend is running }

    SuccessMessage:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }

    SuccessDataResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string, example: Request failed. }

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "0712345678"

    OtpVerification:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "0712345678"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "123456"

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    OtpRequestResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Verification code sent to +254712***678. }
        expires_in_seconds: { type: integer, example: 300 }
        resend_in_seconds: { type: integer, example: 60 }

    User:
      type: object
      properties:
        user_id: { type: integer, example: 3 }
        first_name: { type: string, example: Mary }
        last_name: { type: string, example: Wanjiru }
        phone: { type: string, example: "+254712345678" }
        email:
          type: string
          nullable: true
          example: mary@example.com
        role:
          type: string
          enum: [admin, user, owner, caretaker]
        owner_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, inactive, suspended]

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Authenticated successfully. }
        user:
          $ref: "#/components/schemas/User"
        access_token: { type: string }
        refresh_token: { type: string }

    CurrentUserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        user:
          $ref: "#/components/schemas/User"

    UserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: "#/components/schemas/User"

    UserListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    MpesaCredentials:
      type: object
      required: [consumer_key, consumer_secret]
      properties:
        consumer_key:
          type: string
        consumer_secret:
          type: string
          format: password

    MpesaAccount:
      type: object
      required: [provider_code, account_type, business_number, environment, credentials]
      properties:
        provider_code:
          type: string
          enum: [mpesa]
        account_type:
          type: string
          enum: [paybill, till]
        business_number:
          type: string
          example: "600990"
        display_name:
          type: string
          example: Sandbox Rent
        account_name:
          type: string
          example: Green View Apartments
        environment:
          type: string
          enum: [sandbox, production]
        credentials:
          $ref: "#/components/schemas/MpesaCredentials"

    ConnectPaymentAccountRequest:
      type: object
      required: [account_for, account]
      properties:
        account_for:
          type: string
          enum: [rent, water, electricity, service]
        account:
          $ref: "#/components/schemas/MpesaAccount"
        property_id:
          type: integer
          description: Only when an existing property is changing this account.

    PaymentConnectionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            connection_id:
              type: string
              format: uuid
            account_for:
              type: string
              enum: [rent, water, electricity, service]
            expires_at:
              type: string
              format: date-time

    CreatePropertyRequest:
      type: object
      required:
        - name
        - location
        - rent_connection_id
      properties:
        name: { type: string, example: Green View Apartments }
        location: { type: string, example: Kilimani, Nairobi }
        property_type:
          type: string
          enum: [apartment_block, bedsitters, mixed_use, single_rooms]
          default: apartment_block
        expected_units: { type: integer, minimum: 0, example: 24 }
        rent_due_day:
          type: integer
          minimum: 1
          maximum: 28
          description: Day of the month rent is due.
          example: 5
        move_in_billing:
          type: string
          enum: [prorated, full_month, free_until_next_month]
          default: prorated
          description: |
            How the move-in month is billed. `prorated` bills
            rent x (days in month - move-in day) / days in month.
            Moving in on the 1st is always a full month.
        move_out_billing:
          type: string
          enum: [prorated, full_month]
          default: prorated
          description: |
            How the move-out month is billed. `prorated` bills
            rent x move-out day / days in month.
        sms_sender_id:
          type: string
          nullable: true
          example: KODI
        water_billing_method:
          type: string
          enum: [per_unit_metered, fixed_monthly, included_in_rent]
        water_rate_per_unit: { type: number, example: 100 }
        water_fixed_fee: { type: number, example: 0 }
        water_billing_day: { type: string, example: same_as_rent }
        water_reading_due_days: { type: integer, example: 3 }
        water_missed_reading_action:
          type: string
          enum: [carry_forward, do_not_bill, estimate_average]
        rent_connection_id:
          type: string
          format: uuid
        water_connection_id:
          type: string
          format: uuid
          nullable: true
          description: Optional. Without it, water is paid through the rent account.
        electricity_connection_id:
          type: string
          format: uuid
          nullable: true
          description: Optional. Without it, electricity is paid through the rent account.
        service_connection_id:
          type: string
          format: uuid
          nullable: true
          description: Optional. A separate account for service charges and repairs.
        service_charge_account:
          type: string
          enum: [rent, water, electricity, service]
          default: rent
          description: |
            The account tenants pay service charges and repairs into.
            Anything other than `rent` needs that account's connection ID.

    Property:
      type: object
      properties:
        id: { type: integer }
        owner_id: { type: integer }
        name: { type: string }
        location: { type: string }
        property_type: { type: string }
        expected_units: { type: integer }
        rent_due_day: { type: integer, example: 5 }
        move_in_billing: { type: string }
        move_out_billing: { type: string }
        water_billing_method: { type: string }
        water_rate_per_unit: { type: number }
        water_fixed_fee: { type: number }
        sms_sender_id:
          type: string
          nullable: true
        status: { type: string, example: active }
        rent_account: {}
        water_account:
          nullable: true
          description: Null when water is paid through the rent account.
        electricity_account:
          nullable: true
          description: Null when electricity is paid through the rent account.
        service_account:
          nullable: true
          description: Null unless the property has a separate service charge account.
        service_charge_account:
          type: string
          enum: [rent, water, electricity, service]
          description: The account tenants pay service charges and repairs into.
        summary:
          type: object
          properties:
            total_units: { type: integer }
            occupied_units: { type: integer }
            rent_collected_this_month: { type: number }
        caretaker:
          type: object
          nullable: true
          properties:
            caretaker_id: { type: integer }
            full_name: { type: string }
            phone: { type: string }
            permission_level:
              type: string
              enum: [level_1, level_2]

    UpdatePropertyRequest:
      type: object
      description: Provide at least one field.
      properties:
        name: { type: string, example: Green View Apartments }
        location: { type: string, example: Kilimani, Nairobi }
        property_type:
          type: string
          enum: [apartment_block, bedsitters, mixed_use, single_rooms]
        expected_units: { type: integer, minimum: 0, example: 24 }
        rent_due_day:
          type: integer
          minimum: 1
          maximum: 28
          description: Day of the month rent is due.
          example: 5
        move_in_billing:
          type: string
          enum: [prorated, full_month, free_until_next_month]
          default: prorated
          description: |
            How the move-in month is billed. `prorated` bills
            rent x (days in month - move-in day) / days in month.
            Moving in on the 1st is always a full month.
        move_out_billing:
          type: string
          enum: [prorated, full_month]
          default: prorated
          description: |
            How the move-out month is billed. `prorated` bills
            rent x move-out day / days in month.
        sms_sender_id:
          type: string
          nullable: true
          example: KODI
        service_charge_account:
          type: string
          enum: [rent, water, electricity, service]
          description: |
            The account tenants pay service charges and repairs into.
            The property must have that account.

    PropertyResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          $ref: "#/components/schemas/Property"

    PropertyListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"

    CreateUnitRequest:
      type: object
      required:
        - unit_number
        - monthly_rent
        - rent_deposit
        - water_billing_method
      properties:
        unit_number: { type: string, example: A1 }
        unit_type:
          type: string
          enum: [bedsitter, studio, one_bedroom, two_bedroom, three_bedroom, shop, office, other]
        block_or_floor:
          type: string
          nullable: true
        monthly_rent: { type: number, example: 10000 }
        rent_deposit: { type: number, example: 10000 }
        water_deposit:
          type: number
          default: 0
          description: Set by the owner. Zero means no water deposit.
          example: 2000
        water_billing_method:
          type: string
          enum: [fixed_monthly, per_unit_metered, included_in_rent]
        water_fixed_monthly_bill:
          type: number
          nullable: true
        water_rate_per_unit:
          type: number
          nullable: true
        water_meter_number:
          type: string
          nullable: true
        electricity_monthly_charge:
          type: number
          nullable: true
          description: Optional fixed amount billed with rent on the 1st of every month.
          example: 2000
        electricity_billing_method:
          type: string
          enum: [fixed_monthly, entered]
          default: fixed_monthly
          description: |
            fixed_monthly bills electricity_monthly_charge with rent.
            entered bills the amount the owner types each month.
        electricity_deposit:
          type: number
          nullable: true
          description: Optional one-off deposit charged in full when a tenant moves in.
          example: 2000
        status:
          type: string
          enum: [vacant, reserved, maintenance, inactive]

    UpdateUnitRequest:
      allOf:
        - $ref: "#/components/schemas/CreateUnitRequest"

    Unit:
      type: object
      properties:
        id: { type: integer }
        property_id: { type: integer }
        unit_number: { type: string }
        unit_type: { type: string }
        monthly_rent: { type: number }
        rent_deposit: { type: number }
        water_deposit: { type: number, example: 2000 }
        water_billing_method: { type: string }
        status: { type: string }
        current_tenant:
          type: object
          nullable: true
          description: The active tenant and their outstanding balance, if the unit is occupied.
          properties:
            tenant_id: { type: integer }
            full_name: { type: string }
            status: { type: string }
            balance: { type: number }

    UnitResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: "#/components/schemas/Unit"

    UnitListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Unit"

    CreateTenantRequest:
      type: object
      required: [unit_id, full_name, phone, move_in_date]
      properties:
        unit_id: { type: integer, example: 1 }
        full_name: { type: string, example: Daraja Test Tenant }
        phone:
          type: string
          description: Tenant payment phone; used for automatic M-Pesa matching.
          example: "0708374149"
        email:
          type: string
          format: email
          nullable: true
        national_id:
          type: string
          nullable: true
        move_in_date:
          type: string
          format: date
          example: "2026-09-07"

    UpdateTenantRequest:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        email:
          type: string
          nullable: true
        national_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, notice_given]
        notice_date:
          type: string
          format: date
          nullable: true

    MoveOutRequest:
      type: object
      required: [move_out_date]
      properties:
        move_out_date:
          type: string
          format: date
        deposit_refund_decision:
          type: string
          enum: [full_refund, partial_refund, no_refund]
        move_out_reason:
          type: string
          nullable: true

    Tenant:
      type: object
      properties:
        id: { type: integer }
        owner_id: { type: integer }
        property_id: { type: integer }
        unit_id: { type: integer }
        unit_number: { type: string }
        property_name: { type: string }
        balance:
          type: number
          description: Outstanding amount across open charges. On list and profile responses.
        credit_balance:
          type: number
          description: Overpayment held as credit. On list and profile responses.
        full_name: { type: string }
        phone: { type: string }
        payment_phone: { type: string }
        email:
          type: string
          nullable: true
        monthly_rent: { type: number }
        rent_deposit_due: { type: number }
        water_deposit_due: { type: number }
        status: { type: string }

    TenantResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: "#/components/schemas/Tenant"

    TenantListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"

    MatchPaymentRequest:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: { type: integer }
        remember_payment_phone:
          type: boolean
          default: false

    ManualPaymentRequest:
      type: object
      required: [amount, payment_method]
      properties:
        amount: { type: number, example: 10000 }
        payment_method:
          type: string
          enum: [cash, mpesa, bank, other]
        account_for:
          type: string
          enum: [rent, water, electricity, service]
          default: rent
        received_at:
          type: string
          format: date-time
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    SandboxSimulationRequest:
      type: object
      required: [payment_account_id, phone, amount]
      properties:
        payment_account_id: { type: integer }
        phone: { type: string, example: "0708374149" }
        amount: { type: number, example: 10000 }
        bill_reference: { type: string, example: A1-TENANT }

    Payment:
      type: object
      properties:
        id: { type: integer }
        property_id: { type: integer }
        unit_id:
          type: integer
          nullable: true
        tenant_id:
          type: integer
          nullable: true
        amount: { type: number }
        payment_method: { type: string }
        payment_source: { type: string }
        account_for: { type: string }
        payer_phone: { type: string }
        reference: { type: string }
        status: { type: string }
        match_type:
          type: string
          nullable: true
        applied_to:
          type: array
          items:
            type: object

    PaymentListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"

    DarajaC2BCallback:
      type: object
      properties:
        TransactionType: { type: string, example: Pay Bill }
        TransID: { type: string, example: TEST-PAYMENT-001 }
        TransTime: { type: string, example: "20260907173512" }
        TransAmount: { type: string, example: "10000" }
        BusinessShortCode: { type: string, example: "600990" }
        BillRefNumber: { type: string, example: A1-TENANT }
        MSISDN: { type: string, example: "254708374149" }
        FirstName: { type: string, example: Daraja }

    DarajaAcceptedResponse:
      type: object
      properties:
        ResultCode: { type: integer, example: 0 }
        ResultDesc: { type: string, example: Accepted }

    WaterRulesRequest:
      type: object
      required: [water_billing_method]
      properties:
        water_billing_method:
          type: string
          enum: [per_unit_metered, fixed_monthly, included_in_rent]
        water_rate_per_unit: { type: number, example: 100 }
        water_fixed_fee: { type: number, example: 2000 }
        water_billing_day: { type: string, example: same_as_rent }
        water_reading_due_days: { type: integer, example: 3 }
        water_missed_reading_action:
          type: string
          enum: [carry_forward, do_not_bill, estimate_average]
        apply_to_occupied_units:
          type: boolean
          default: false

    WaterReadingRequest:
      type: object
      required: [billing_period, current_reading]
      properties:
        billing_period:
          type: string
          format: date
        current_reading: { type: number, example: 120 }
        previous_reading: { type: number, example: 100 }
        meter_photo_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    ReviewWaterReadingRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        corrected_current_reading:
          type: number
        notes:
          type: string
          nullable: true

    AgreementTemplateRequest:
      type: object
      required: [content]
      properties:
        name:
          type: string
          example: Standard tenancy agreement
        content:
          type: string
          minLength: 40
        notice_period_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30

    DepositDeductionsRequest:
      type: object
      properties:
        deductions:
          type: array
          description: Amounts kept from the rent deposit, such as repainting.
          items:
            type: object
            required: [description, amount]
            properties:
              description: { type: string, example: Repainting }
              amount: { type: number, example: 1000 }

    CreateServiceChargeRequest:
      type: object
      required: [name, category, frequency, amount]
      properties:
        name: { type: string, example: Garbage collection }
        category:
          type: string
          enum: [repairs_maintenance, security, garbage, cleaning, utilities, other]
          description: The expense category this charge recovers.
        frequency:
          type: string
          enum: [monthly, once]
        amount:
          type: number
          example: 300
          description: Billed to every unit that has no amount of its own.
        unit_amounts:
          type: array
          description: Units that pay a different amount. Zero means the unit is not charged.
          items:
            type: object
            required: [unit_id, amount]
            properties:
              unit_id: { type: integer }
              amount: { type: number, example: 500 }

    UpdateServiceChargeRequest:
      type: object
      description: Provide at least one field.
      properties:
        name: { type: string }
        category:
          type: string
          enum: [repairs_maintenance, security, garbage, cleaning, utilities, other]
        amount: { type: number }
        unit_amounts:
          type: array
          items:
            type: object
            required: [unit_id, amount]
            properties:
              unit_id: { type: integer }
              amount: { type: number }

    CreateExpenseRequest:
      type: object
      required: [category, amount, expense_date]
      properties:
        category:
          type: string
          enum: [repairs_maintenance, security, garbage, cleaning, utilities, other]
        amount: { type: number, example: 2500 }
        expense_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        receipt_url:
          type: string
          format: uri
          nullable: true

    CreateMaintenanceRequest:
      type: object
      required: [title]
      properties:
        unit_id:
          type: integer
          nullable: true
        title: { type: string, example: Leaking kitchen tap }
        description:
          type: string
          nullable: true
        category:
          type: string
          enum: [plumbing, electrical, water, structural, security, cleaning, appliance, other]
        priority:
          type: string
          enum: [low, normal, high, urgent]

    UpdateMaintenanceRequest:
      type: object
      properties:
        status:
          type: string
          enum: [reported, in_progress, resolved, cancelled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assigned_caretaker_id:
          type: integer
          nullable: true
        assigned_vendor_name:
          type: string
          nullable: true
        estimated_cost:
          type: number
          nullable: true
        actual_cost:
          type: number
          nullable: true
        charge_to_tenant:
          type: boolean
          description: |
            Owner only. When the request is resolved with an actual cost, the
            cost is always recorded as a property expense. If this is true it
            is also charged to the tenant living in the unit. The tenant is
            not told automatically; send the SMS with
            POST /api/maintenance/{request_id}/charge-sms.
            The cost cannot be changed afterwards.
        resolution_notes:
          type: string
          nullable: true
        cancellation_reason:
          type: string
          nullable: true

    AssignCaretakerRequest:
      type: object
      required: [phone, first_name, last_name]
      properties:
        phone: { type: string, example: "0712345678" }
        first_name: { type: string, example: Peter }
        last_name: { type: string, example: Mwangi }
        permission_level:
          type: string
          enum: [level_1, level_2]
          default: level_1

    UpdateCaretakerRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        permission_level:
          type: string
          enum: [level_1, level_2]
        status:
          type: string
          enum: [active, inactive]

    SmsTemplateRequest:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
          example: Balance reminder
        body:
          type: string
          example: "Dear {name}, your balance for house {house} is KES {balance}."

    SmsRecipientTarget:
      type: object
      required: [recipient_group]
      properties:
        recipient_group:
          type: string
          enum: [all_active_tenants, tenants_with_arrears, tenants_with_credit_balance, property, specific_tenant]
        property_id:
          type: integer
          description: Required only when recipient_group is property.
        tenant_id:
          type: integer
          description: Required only when recipient_group is specific_tenant.

    CreateSmsBroadcastRequest:
      allOf:
        - $ref: "#/components/schemas/SmsRecipientTarget"
        - type: object
          properties:
            template_id:
              type: integer
            message:
              type: string
              description: Required when template_id is omitted.
            variables:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: number
            send_at:
              type: string
              format: date-time
              description: Omit to send now. Must be a future timestamp when supplied.

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Mary Wanjiru
        email:
          type: string
          format: email
          nullable: true

    OwnerDefaultsRequest:
      type: object
      required: [default_rent_due_day]
      properties:
        default_rent_due_day:
          type: integer
          minimum: 1
          maximum: 28
          example: 5

    NotificationPreferencesRequest:
      type: object
      properties:
        notify_payment_received: { type: boolean }
        auto_rent_reminder: { type: boolean }
        remind_water_readings: { type: boolean }
        alert_suspicious_water: { type: boolean }
        weekly_collection_summary: { type: boolean }
        monthly_profit_report: { type: boolean }