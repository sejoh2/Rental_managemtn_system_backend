        - $ref: "#/components/parameters/MaintenanceRequestId"
      responses:
        "200":
          description: SMS sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
        "502":
          description: The SMS provider refused the message

  /api/properties/{property_id}/maintenance:
    post:
      tags: [Step 10 - Maintenance]
      summary: Create maintenance request
      description: Owner or assigned caretaker.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceRequest"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/live/ticket:
    post:
      tags: [Live notifications]
      summary: A one-minute pass for the live bell connection
      description: |
        Signed in. ?for=admin (the admin's bell; administrator only) or
        ?for=owner (the bell of the owner account in use; an admin inside
        an owner's account gets that owner's bell). The pass is a token of
        type `live`, valid 60 seconds, tied to the sign-in session; it is
        not accepted anywhere else.
      security:
        - bearerAuth: []
      parameters:
        - name: for
          in: query
          schema: { type: string, enum: [admin, owner] }
      responses:
        "200":
          description: The pass
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      ticket: { type: string }
                      expires_in_seconds: { type: integer, example: 60 }
        "403":
          description: Not this person's bell

  /api/live/stream:
    get:
      tags: [Live notifications]
      summary: The live bell connection (Server-Sent Events)
      description: |
        Open with ?ticket=<pass from /api/live/ticket>, e.g. with the
        browser's EventSource. Events: `ready` once when opened, then
        `bell` whenever something that bell counts changes (no data: the
        client fetches the counts again). Comment lines every 25 seconds keep
        proxies from closing it. Refused with 401 for a missing, expired or
        forged pass, or a session that has ended; a session that ends while
        open is closed within 5 minutes. At most 10 connections per person
        (429). The changes are announced by database triggers through
        PostgreSQL NOTIFY on the channel bell_changed, so every running server
        receives them.
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: Missing, expired or forged pass, or the session ended
        "429":
          description: Too many open connections for this person

  /api/caretaker/properties:
    get:
      tags: [Step 11 - Caretakers]
      summary: The properties the signed-in caretaker looks after
      description: |
        Caretaker only. Where the caretaker app starts.

        What a caretaker may then use, in a property they are assigned to:
        GET /api/properties/{property_id}/units (with current tenant and
        balance), tenants (level 1 view, level 2 add and edit), water
        readings (record, correct, cancel, resolve a flagged one),
        expenses, maintenance, electricity bills, files (see /api/files),
        and POST /api/tenants/{tenant_id}/payments/manual when
        `can_record_payments` is on. Their actions are in the audit log
        under their own name with `by_caretaker: true`.

        Sending twice: any POST, PUT, PATCH or DELETE may carry an
        `Idempotency-Key` header (16 to 100 letters, digits, hyphens or
        underscores, one per thing being saved). The first request is
        carried out; a repeat with the same key returns the first answer
        with the header `Idempotent-Replay: true` and changes nothing.
        A refused request frees its key. The same key on a different
        address is refused with 422; a repeat while the first is still
        running gets 409.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        location: { type: string }
                        rent_due_day: { type: integer }
                        water_billing_method: { type: string }
                        water_rate_per_unit: { type: number, nullable: true }
                        water_fixed_fee: { type: number, nullable: true }
                        total_units: { type: integer }
                        occupied_units: { type: integer }
                        permission_level: { type: string, enum: [level_1, level_2] }
                        can_manage_tenants: { type: boolean }
                        can_record_payments: { type: boolean }

  /api/properties/{property_id}/caretaker/payment-permission:
    put:
      tags: [Step 11 - Caretakers]
      summary: Allow or stop the property's caretaker recording payments
      description: |
        Owner only. Off for every new assignment, also when a caretaker
        is put back on a property. Audited as
        CARETAKER_PAYMENT_PERMISSION_CHANGED. `can_record_payments` is
        also on each row of GET /api/caretakers.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed]
              properties:
                allowed: { type: boolean }
      responses:
        "200":
          description: Permission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
        "404":
          description: The property has no caretaker

  /api/caretakers:
    get:
      tags: [Step 11 - Caretakers]
      summary: List owner caretakers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caretakers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/caretakers/{caretaker_id}:
    get:
      tags: [Step 11 - Caretakers]
      summary: Get caretaker profile and activity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaretakerId"
      responses:
        "200":
          description: Caretaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    patch:
      tags: [Step 11 - Caretakers]
      summary: Update a caretaker's name, phone number or sign-in status
      description: |
        Owner only.
        `status: suspended` stops the caretaker signing in but keeps their
        properties; `status: active` lifts it. Changing `phone` changes the
        number they sign in with and signs them out; it is refused (409) if
        the number belongs to another user. One caretaker may be assigned to
        several properties with `POST /api/properties/{property_id}/caretaker`.
        Written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaretakerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide at least one field.
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string, example: "0733908771" }
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        "200":
          description: Caretaker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
        "409":
          description: The phone number belongs to another user

  /api/properties/{property_id}/caretaker:
    post:
      tags: [Step 11 - Caretakers]
      summary: Assign or replace property caretaker
      description: |
        If the phone number has no account yet, one is created here; the caretaker
        then signs in with the normal OTP flow. An existing account must be a normal
        user or already one of this owner's caretakers.
        Each property has one active caretaker. This assigns Level 1 or Level 2 access.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCaretakerRequest"
      responses:
        "201":
          description: Caretaker assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    patch:
      tags: [Step 11 - Caretakers]
      summary: Update, suspend, or reactivate property caretaker
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaretakerRequest"
      responses:
        "200":
          description: Caretaker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/stats:
    get:
      tags: [Step 12 - SMS Centre]
      summary: Get SMS Centre statistics
      description: |
        Counts for the current month in Kenyan time. `accepted` means the
        SMS provider accepted the message; delivery to the handset is not
        tracked. `next_scheduled_at` is the next scheduled broadcast, and
        `sms_mode` is `console` when messages are only printed in the
        backend terminal and do not reach a phone.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SMS statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/recipients/estimate:
    post:
      tags: [Step 12 - SMS Centre]
      summary: Estimate SMS recipients and cost
      description: |
        Uses real tenant balances and credits. Tenants who are active or have
        given notice are included. `estimated_cost` assumes one SMS per
        tenant; a message over 160 characters is billed as more.
        Each recipient carries a `balance`: a payment reminder (see
        Create broadcast) is not sent to those whose balance is 0.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsRecipientTarget"
      responses:
        "200":
          description: Recipient count and estimated cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/templates:
    get:
      tags: [Step 12 - SMS Centre]
      summary: List saved SMS templates
      description: |
        The first time an owner's templates are listed they receive four
        starter templates, which they may edit or delete.
        Placeholders: {name}, {house}, {property}, {balance}, {amount},
        {month}, {due_date} (as 5 Oct 2026) and {days_overdue}.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    post:
      tags: [Step 12 - SMS Centre]
      summary: Create SMS template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsTemplateRequest"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/templates/{template_id}:
    patch:
      tags: [Step 12 - SMS Centre]
      summary: Update SMS template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsTemplateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    delete:
      tags: [Step 12 - SMS Centre]
      summary: Delete SMS template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Template deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/sms/broadcasts:
    get:
      tags: [Step 12 - SMS Centre]
      summary: List SMS broadcasts
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, sending, completed, partially_failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Broadcasts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    post:
      tags: [Step 12 - SMS Centre]
      summary: Create immediate or scheduled broadcast
      description: |
        Without `send_at` the messages are written and sent now. With
        `send_at` only the selection is stored: the recipients and their
        balances are worked out when the broadcast is sent, so
        `recipient_count` is 0 until then. If nobody matches at that time
        the broadcast completes with no messages.

        A message that uses {balance}, {amount}, {due_date} or
        {days_overdue} is a payment reminder and is not sent to a tenant
        who owes nothing. Sent now, it is refused with 422 when every
        selected tenant owes nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSmsBroadcastRequest"
      responses:
        "201":
          description: Broadcast queued or scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/broadcasts/{broadcast_id}/cancel:
    post:
      tags: [Step 12 - SMS Centre]
      summary: Cancel scheduled broadcast
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BroadcastId"
      responses:
        "200":
          description: Broadcast cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/messages:
    get:
      tags: [Step 12 - SMS Centre]
      summary: List individual SMS message records
      description: |
        Includes single messages the system sends outside a broadcast, such
        as a repair charge notice; those have `broadcast_id: null`.
      security:
        - bearerAuth: []
      parameters:
        - name: property_id
          in: query
          schema:
            type: integer
        - name: tenant_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, accepted, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: SMS records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/sms/messages/{message_id}/retry:
    post:
      tags: [Step 12 - SMS Centre]
      summary: Retry failed SMS message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SmsMessageId"
      responses:
        "200":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/reports/dashboard:
    get:
      tags: [Step 13 - Reports]
      summary: Get dashboard report
      description: |
        Periods and dates are in Kenyan time. `collection` holds income by
        kind (rent, water, electricity, service charges, repairs and
        deductions) with `total_income`, using the same definition as
        `/api/expenses/summary`; deposits are listed separately and are not
        income. `arrears` separates what current tenants owe
        (`total_arrears`) from what former tenants still owe
        (`total_former_arrears`). Archived properties are left out.
        Owners may request all their properties or one property.
        Caretakers must provide their assigned `property_id`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportPropertyId"
        - $ref: "#/components/parameters/ReportPeriod"
      responses:
        "200":
          description: Occupancy, arrears, collection, water, expense, and SMS data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/reports/export:
    get:
      tags: [Step 13 - Reports]
      summary: Export report as PDF or CSV
      description: |
        Holds the totals for the chosen type and a line per tenant under
        them: rent billed and paid per tenant, each water bill, and each
        tenant who owes money. The export is written to the audit log, and
        CSV cells that a spreadsheet would read as a formula are neutralised.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            default: full_monthly_summary
            enum: [full_monthly_summary, rent_collection, water_billing, occupancy_arrears, sms_usage]
        - $ref: "#/components/parameters/ReportPropertyId"
        - $ref: "#/components/parameters/ReportPeriod"
        - name: format
          in: query
          schema:
            type: string
            default: pdf
            enum: [pdf, csv]
      responses:
        "200":
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary

  /api/reports/tenants/{tenant_id}/statement:
    get:
      tags: [Step 13 - Reports]
      summary: Get tenant statement data
      description: |
        Includes `deposit_settlement` once a moved-out tenant's deposits
        have been reconciled, otherwise null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReportPeriod"
      responses:
        "200":
          description: Tenant charges, payments, balance, and credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/reports/tenants/{tenant_id}/statement/download:
    get:
      tags: [Step 13 - Reports]
      summary: Download tenant statement PDF
      description: The download is written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReportPeriod"
      responses:
        "200":
          description: PDF statement
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/dashboard/home:
    get:
      tags: [Dashboard]
      summary: Figures for the owner's dashboard home
      description: |
        Owner only. Rent collected this month and last month, rent still
        owed by current tenants, occupancy, the three latest unmatched
        payments, this month's water, rent collected in each of the last six
        months, and the eight latest events (payments, meter readings,
        maintenance reports, tenants added). Months are Kenyan time.
      security:
        - bearerAuth: []
      parameters:
        - name: property_id
          in: query
          description: One property. Omit for all properties.
          schema: { type: integer }
      responses:
        "200":
          description: Dashboard figures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/dashboard/attention:
    get:
      tags: [Dashboard]
      summary: Counts of what is waiting for the owner
      description: |
        Owner only. Unmatched payments, flagged meter readings, failed SMS
        and open maintenance requests, with their total.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/dashboard/search:
    get:
      tags: [Dashboard]
      summary: Search tenants and payments
      description: |
        Owner only. Tenants by name, phone, ID number or house number, and
        payments by M-Pesa code or reference. At most six tenants and five
        payments.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings:
    get:
      tags: [Step 14 - Settings]
      summary: Get owner profile, defaults, and notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/profile:
    patch:
      tags: [Step 14 - Settings]
      summary: Update owner profile
      description: |
        Phone is not editable here because it is the OTP login identity.
        Changing a phone requires a future OTP-confirmed phone-change flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/defaults:
    patch:
      tags: [Step 14 - Settings]
      summary: Update owner defaults
      description: Default rent due day affects future setup; existing property settings remain separate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerDefaultsRequest"
      responses:
        "200":
          description: Defaults updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/notifications:
    patch:
      tags: [Step 14 - Settings]
      summary: Update notification preferences
      description: |
        Two preferences act today. `alert_suspicious_water` sends the owner
        an SMS when a meter reading is flagged. `remind_water_readings`
        sends each property's caretaker one SMS on the water billing day
        (after 8 AM Kenyan time) if readings for the month are missing.
        The other four are saved but do nothing yet.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesRequest"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/audit-logs:
    get:
      tags: [Step 14 - Settings]
      summary: List owner and caretaker audit activity
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/settings/properties/{property_id}:
    get:
      tags: [Step 14 - Settings]
      summary: Get property settings context
      description: |
        Returns real property, unit summary, payment-account, and caretaker context.
        Water rules and payment accounts remain managed through their existing endpoints.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property settings context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    PropertyId:
      name: property_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    PaymentAccountId:
      name: payment_account_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    UnitId:
      name: unit_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ReadingId:
      name: reading_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    AgreementId:
      name: agreement_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ExpenseId:
      name: expense_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ServiceChargeId:
      name: service_charge_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    MaintenanceRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    CaretakerId:
      name: caretaker_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    BroadcastId:
      name: broadcast_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    SmsMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ReportPropertyId:
      name: property_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1

    ReportPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        default: this_month
        enum: [this_month, last_month, last_3_months, last_6_months, this_year]

    ExpenseFilters:
      name: property_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1

  responses:
    UnauthorizedError:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ForbiddenError:
      description: User lacks the required role or property permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request data is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    RateLimitError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: string, example: healthy }
        message: { type: string, example: Rental Management Backend is running }

    SuccessMessage:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }

    SuccessDataResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string, example: Request failed. }

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "0712345678"

    OtpVerification:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "0712345678"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "123456"

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    OtpRequestResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Verification code sent to +254712***678. }
        expires_in_seconds: { type: integer, example: 300 }
        resend_in_seconds: { type: integer, example: 60 }

    User:
      type: object
      properties:
        user_id: { type: integer, example: 3 }
        first_name: { type: string, example: Mary }
        last_name: { type: string, example: Wanjiru }
        phone: { type: string, example: "+254712345678" }
        email:
