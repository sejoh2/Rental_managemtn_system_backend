        content:
          application/json:
            schema:
              type: object
              required: [paid_on, method]
              properties:
                paid_on: { type: string, format: date }
                method:
                  type: string
                  enum: [mpesa, cash, bank, other]
                reference:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Refund recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

