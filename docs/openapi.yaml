  /api/properties/{property_id}/units/{unit_id}/water-readings:
    post:
      tags: [Step 7 - Water billing]
      summary: Submit meter reading
      description: |
        Owner, or the caretaker assigned to the property. A reading lower than the
        previous one is flagged and not billed until the owner corrects or rejects it.

        The unit must be per-unit metered and have a tenant living in it.
        The bill is the units used times the UNIT's own water rate; the
        property's water settings are only the defaults a new unit starts
        with.

        Each tenant is read once per billing month. A unit that changed
        tenant during the month can be read again for the new tenant, from
        the unit's latest reading. `final_reading: true` records one extra
        reading for a tenant already read that month, for when they move
        out; it is billed as a separate water charge for the units used
        since, and the reading carries `is_final`.

        The previous reading is the unit's last recorded reading.
        GET .../water-readings/previous?billing_period=YYYY-MM-01 returns
        it (`previous_reading`, null if the unit was never read) so a form
        can show it first. `previous_reading` may be sent to raise it, for
        water used while the unit stood empty, but a value below the last
        recorded reading is refused with 422. A unit's first reading must
        send it.

        PATCH /api/water-readings/{reading_id} (owner only) corrects a
        submitted reading: `previous_reading`, `current_reading`, `notes`.
        Any submitted reading can be edited, from any month (`can_edit`
        on the list), except one whose bill was settled from a deposit at
        move-out (409: reopen the reconciliation first). The previous
        reading cannot go below the reading before it, and the current
        reading cannot go above where the unit's next reading starts
        (422). The bill is recalculated at the rate it was billed at;
        anything the tenant had paid above the new bill returns to them as
        credit (`returned_as_credit`), and a higher bill leaves the
        difference owed. Audited as WATER_METER_READING_EDITED with the
        figures before and after.

        POST /api/water-readings/{reading_id}/cancel (owner only, body
        `reason`, 3 to 500 characters) cancels a submitted reading and its
        bill. What the tenant had paid towards the bill returns to them as
        credit. The reading stays listed with status `rejected` and notes
        starting "Cancelled:", and a new reading can be recorded for the
        same tenant and month (the cancelled bill is opened again with the
        new amount). Refused with 409 when the bill was settled from a
        deposit. Audited as WATER_METER_READING_CANCELLED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaterReadingRequest"
      responses:
        "201":
          description: Reading submitted or flagged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/{property_id}/water-bills/generate-fixed:
    post:
      tags: [Step 7 - Water billing]
      summary: Generate fixed monthly water bills
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billing_period]
              properties:
                billing_period:
                  type: string
                  format: date
                  example: "2026-10-01"
      responses:
        "200":
          description: Fixed bills generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/water-readings/{reading_id}/cancel:
    post:
      tags: [Step 7 - Water billing]
      summary: Cancel a water reading and its bill
      description: |
        Owner only. See "Submit water reading" for the rules.
      security:
        - bearerAuth: []
      parameters:
        - name: reading_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  example: Recorded for the wrong house
      responses:
        "200":
          description: Reading and bill cancelled
          content:
            application/json:
              schema:
