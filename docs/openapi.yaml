          maxLength: 50
          description: |
            One of the usual types (bedsitter, studio, one_bedroom,
            two_bedroom, three_bedroom, shop, office, other) or the owner's
            own wording, stored as typed, such as "Single room".
          example: Single room
        block_or_floor:
          type: string
          nullable: true
        monthly_rent: { type: number, example: 10000 }
        rent_deposit: { type: number, example: 10000 }
        water_deposit:
          type: number
          default: 0
          description: Set by the owner. Zero means no water deposit.
          example: 2000
        water_billing_method:
          type: string
          enum: [fixed_monthly, per_unit_metered, included_in_rent]
        water_fixed_monthly_bill:
          type: number
          nullable: true
