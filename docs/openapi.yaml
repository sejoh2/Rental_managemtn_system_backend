    post:
      tags: [Step 5 - Tenants]
      summary: Undo a move-out
      description: |
        Owner only. Puts back a tenant who was moved out by mistake: they
        are `active` in the unit again, the unit is `occupied`, and their
        bills return to what they were just before the move-out (kept in
        `tenants.move_out_snapshot`): a reduced last month is charged in
        full again, voided later bills are open again, repairs waiting for
        move-out are `held` again, and credit is applied again. Months
        that passed while they were moved out are not billed.

        Refused with 409 when the deposits have been reconciled (reopen
        the reconciliation first), when the unit has another tenant, when
        the unit is not in use, or when the tenant was moved out before
        snapshots were kept and that move-out changed a bill.
        Audited as TENANT_MOVE_OUT_UNDONE.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  example: Moved out the wrong tenant
      responses:
        "200":
          description: Move-out undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "409":
          description: It can no longer be undone

