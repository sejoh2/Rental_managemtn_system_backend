  /api/properties/{property_id}/service-charges:
    get:
      tags: [Service charges]
      summary: List a property's service charges
      description: |
        Owner only. Each charge lists what every unit of the property pays
        for it in `unit_amounts`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Service charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    post:
      tags: [Service charges]
      summary: Add a service charge
      description: |
        Owner only. A cost passed on to tenants, such as garbage or security.

        Tenants living in the property are billed straight away:
        - `monthly`: the rest of this month under the property's
          `move_in_billing` rule (pro-rated: amount x (days in month - today's
          day) / days in month), then the full amount on the 1st of each month.
          The move-out month follows `move_out_billing`.
        - `once`: the full amount, a single time. Each new tenant is also
          billed once when they move in.

        The response includes `billing: { tenants_billed, total_billed }`.
        The action is written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceChargeRequest"
      responses:
        "201":
          description: Service charge added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
        "409":
          description: The property already has a service charge with this name

  /api/service-charges/{service_charge_id}:
    patch:
      tags: [Service charges]
      summary: Update a service charge
      description: |
        Owner only. New amounts apply to bills created from now on; charges
        tenants were already billed are not changed. The frequency cannot be
        changed. When `unit_amounts` is sent it replaces all per-unit amounts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceChargeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceChargeRequest"
      responses:
        "200":
          description: Service charge updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    delete:
      tags: [Service charges]
      summary: Remove a service charge
      description: |
        Owner only. The charge is no longer billed. What tenants were already
        billed stays on their accounts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceChargeId"
      responses:
        "200":
          description: Service charge removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/expenses/reconciliation:
    get:
      tags: [Step 9 - Expenses]
      summary: Compare what was spent with what tenants were charged
      description: |
        For each expense category: `spent` (expenses in the period),
        `charged` (service charges, repairs and move-out deductions billed to
        tenants for the period), `paid` (how much of that tenants have paid),
        `outstanding` (charged - paid) and `owner_cost` (spent - charged).
        A monthly charge belongs to its billing month; a one-off charge, repair
        or deduction belongs to the day it was billed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpenseFilters"
      responses:
        "200":
          description: Reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/{property_id}/electricity-bills:
    get:
      tags: [Electricity bills]
      summary: List the month's electricity bills for units billed by entered amount
      description: |
        Owner only. Returns every unit whose `electricity_billing_method` is
        `entered`, the tenant living there and the amount entered for the month.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - name: period
          in: query
          description: Month as YYYY-MM. Defaults to the current month.
          schema: { type: string, example: 2026-10 }
      responses:
        "200":
          description: Electricity bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

    put:
      tags: [Electricity bills]
      summary: Enter the month's electricity amount per unit
      description: |
        Owner only. Bills the tenant living in each unit exactly the amount
        entered. Sending a new amount replaces the earlier one; it cannot be
        lower than what the tenant has already paid towards it. Zero removes an
        unpaid bill. Written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, bills]
              properties:
                period: { type: string, example: 2026-10 }
                bills:
                  type: array
                  items:
                    type: object
                    required: [unit_id, amount]
                    properties:
                      unit_id: { type: integer }
                      amount: { type: number, example: 850 }
      responses:
        "200":
          description: Electricity bills saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/tenants/{tenant_id}/deposit-reconciliation:
    get:
      tags: [Deposit reconciliation]
      summary: Get a moved-out tenant's deposit reconciliation
      description: |
        Owner only. Before it is confirmed, `status` is `open` and `groups`
        shows each deposit separately: what is held, the unpaid bills it has
        to cover, what is left and any shortfall. The rent deposit covers rent,
        service charges, repairs and deductions; the water deposit covers
        water; the electricity deposit covers electricity. After it is
        confirmed, `status` is `confirmed` and `settlement` holds the result.

        `repairs` lists every repair charged to the tenant during the stay,
        including those already paid, which `groups` does not show:
        `amount`, `paid_during_stay`, `covered_at_move_out` and `unpaid`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/tenants/{tenant_id}/deposit-reconciliation/calculate:
    post:
      tags: [Deposit reconciliation]
      summary: Calculate the final figure without saving
      description: |
        Owner only. Merges the deposits and any credit the tenant holds and
        returns `refund_due` or `tenant_owes` for the deductions sent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositDeductionsRequest"
      responses:
        "200":
          description: Final figure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/tenants/{tenant_id}/deposit-reconciliation/confirm:
    post:
      tags: [Deposit reconciliation]
      summary: Confirm the reconciliation
      description: |
        Owner only, final. Deductions become charges on the tenant. Each
        deposit pays its own bills, then money left over and credit pay what
        remains. Deposit money used for a bill counts as income on this day.
        What is left is the refund due; what is still unpaid stays as the
        tenant's debt. Written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositDeductionsRequest"
      responses:
        "200":
          description: Deposits reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"
        "409":
          description: Already reconciled

  /api/tenants/{tenant_id}/deposit-reconciliation/refund:
    post:
      tags: [Deposit reconciliation]
      summary: Record that the refund was paid to the tenant
      description: Owner only. The refund is paid once, in full. Written to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
