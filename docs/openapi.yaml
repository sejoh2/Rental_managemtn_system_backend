  /api/maintenance/{request_id}/charge-sms:
    post:
      tags: [Step 10 - Maintenance]
      summary: Send the tenant an SMS about a repair charged to them
      description: |
        Owner or assigned caretaker. Sent only on request, never
        automatically, and may be sent again. Refused (400) if the repair was
        not charged to a tenant. The message appears in the SMS centre
        history and `charge_sms_sent_at` is set on the request. Written to
        the audit log.
      security:
        - bearerAuth: []
