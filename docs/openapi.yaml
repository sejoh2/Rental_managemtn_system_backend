openapi: 3.0.3

info:
  title: Kodi Rental Management API
  version: 1.0.0
  description: |
    Backend API for Kodi Rental Management System.

    Recommended implementation order:
    1. Authentication
    2. Admin owner promotion
    3. Property and M-Pesa account setup
    4. Units and tenants
    5. Payments and M-Pesa C2B callbacks
    6. Water billing
    7. Agreements
    8. Expenses and maintenance
    9. Caretakers
    10. SMS Centre
    11. Reports
    12. Settings

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
  - name: Step 1 - Authentication
  - name: Step 2 - Admin users
  - name: Step 3 - Properties and M-Pesa
  - name: Step 4 - Units
  - name: Step 5 - Tenants
  - name: Step 6 - Payments
  - name: Step 7 - Water billing
  - name: Step 8 - Agreements
  - name: Step 9 - Expenses
  - name: Service charges
  - name: Electricity bills
  - name: Deposit reconciliation
  - name: Step 10 - Maintenance
  - name: Step 11 - Caretakers
  - name: Step 12 - SMS Centre
  - name: Step 13 - Reports
  - name: Step 14 - Settings

paths:
  /health:
    get:
      tags: [Health]
      summary: Check backend health
      responses:
        "200":
          description: Backend is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/request-otp:
    post:
      tags: [Step 1 - Authentication]
      summary: Request OTP sign-in code
      description: |
        Creates an OTP request. New verified phone numbers become normal `user` accounts.
        Limited to five requests per 15 minutes per client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/auth/verify-otp:
    post:
      tags: [Step 1 - Authentication]
      summary: Verify OTP and authenticate
      description: |
        Returns an access token and refresh token. A new phone becomes a normal `user`;
        an admin can later promote that user to `owner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /api/auth/refresh-token:
    post:
      tags: [Step 1 - Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/logout:
    post:
      tags: [Step 1 - Authentication]
      summary: Log out and revoke refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/auth/me:
    get:
      tags: [Step 1 - Authentication]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/users:
    get:
      tags: [Step 2 - Admin users]
      summary: List all users
      description: Admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/users/{user_id}:
    get:
      tags: [Step 2 - Admin users]
      summary: Get user by ID
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/users/{user_id}/promote-owner:
    post:
      tags: [Step 2 - Admin users]
      summary: Promote normal user to owner
      description: |
        Admin only. Target must be an active normal `user`.
        A person cannot self-register as an owner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/users/{user_id}/deactivate:
    post:
      tags: [Step 2 - Admin users]
      summary: Deactivate user
      description: Admin only. Revokes their refresh-token sessions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/users/{user_id}/activate:
    post:
      tags: [Step 2 - Admin users]
      summary: Activate inactive or suspended user
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/admin/audit-logs:
    get:
      tags: [Step 2 - Admin users]
      summary: List the audit log across all owner accounts
      description: |
        Admin only. Each entry names the person who acted (`actor`) and the owner
        account it happened in (`account`). Automatic entries have no actor.
      security:
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: query
          description: Only entries belonging to this owner account.
          schema: { type: integer }
        - name: user_id
          in: query
          description: Only entries performed by this user.
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string, example: MANUAL_PAYMENT_RECORDED }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Audit entries, newest first, with the total matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/admin/audit-logs/actions:
    get:
      tags: [Step 2 - Admin users]
      summary: List the action names present in the audit log
      description: Admin only. Used to fill the action filter.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Action names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/c2b/validation:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Daraja C2B validation callback
      description: Public callback called by Safaricom Daraja. No bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DarajaC2BCallback"
      responses:
        "200":
          description: Accepted by Kodi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DarajaAcceptedResponse"

  /api/properties/c2b/confirmation:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Daraja C2B confirmation callback
      description: |
        Public callback called by Safaricom Daraja after a payment.
        The backend identifies the property account, matches tenant payment phone,
        creates a payment, and applies money deposit-first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DarajaC2BCallback"
      responses:
        "200":
          description: Accepted by Kodi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DarajaAcceptedResponse"

  /api/properties/payment-accounts/connect:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Validate M-Pesa account credentials before property creation
      description: Owner only. Returns a short-lived connection ID required in property creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectPaymentAccountRequest"
      responses:
        "200":
          description: M-Pesa credentials validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConnectionResponse"

  /api/properties:
    get:
      tags: [Step 3 - Properties and M-Pesa]
      summary: List owner properties
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"

    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Create property with Rent and Water M-Pesa accounts
      description: |
        Owner only. The rent M-Pesa connection must have been validated first.
        Water and electricity connections are optional; each account needs its
        own connection and its own business number.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
      responses:
        "201":
          description: Property and payment accounts created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"

  /api/properties/{property_id}:
    get:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Get property and payment account details
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"

    patch:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Update property details
      description: |
        Owner only. Edits the descriptive details. Water rules, payment accounts,
        and the caretaker are changed through their own endpoints.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyRequest"
      responses:
        "200":
          description: Property updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "409":
          description: Another property of this owner already uses the name

    delete:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Archive property
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/properties/{property_id}/payment-accounts/{account_for}:
    put:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Change a property's rent or water M-Pesa account
      description: |
        Owner only. First validate the new credentials with
        `POST /api/properties/payment-accounts/connect`, sending `property_id` so the
        property may keep its current business number, then pass the returned
        `connection_id` here. Callback URLs are registered with Daraja for the new account.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - name: account_for
          in: path
          required: true
          schema:
            type: string
            enum: [rent, water, electricity, service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id]
              properties:
                connection_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Payment account changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"

    delete:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Remove a property's water, electricity or service charge M-Pesa account
      description: |
        Owner only. The rent account cannot be removed. Afterwards those charges
        are paid through the rent account. Earlier payments stay on record.
        If service charges were paid into the removed account, the property's
        `service_charge_account` goes back to `rent`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - name: account_for
          in: path
          required: true
          schema:
            type: string
            enum: [water, electricity, service]
      responses:
        "200":
          description: Payment account removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"

  /api/properties/{property_id}/payment-accounts/{payment_account_id}/register-c2b-urls:
    post:
      tags: [Step 3 - Properties and M-Pesa]
      summary: Re-register Daraja callback URLs
      description: |
        Owner only. Use after `PUBLIC_API_URL` changes, such as after restarting
        a free ngrok tunnel.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/PaymentAccountId"
      responses:
        "200":
          description: C2B URLs registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/{property_id}/units:
    get:
      tags: [Step 4 - Units]
      summary: List units in property
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitListResponse"

    post:
      tags: [Step 4 - Units]
      summary: Create unit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
      responses:
        "201":
          description: Unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"

  /api/units/{unit_id}:
    get:
      tags: [Step 4 - Units]
      summary: Get unit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200":
          description: Unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"

    patch:
      tags: [Step 4 - Units]
      summary: Update unit
      description: |
        Unit cannot be manually set to `occupied`; tenant move-in controls occupancy.
        The status of an occupied unit cannot be changed until the tenant moves out.
        Changing `monthly_rent` on an occupied unit also updates the current tenant's
        monthly rent; charges already billed are not changed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUnitRequest"
      responses:
        "200":
          description: Unit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"

    delete:
      tags: [Step 4 - Units]
      summary: Archive unit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200":
          description: Unit archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/properties/{property_id}/tenants:
    get:
      tags: [Step 5 - Tenants]
      summary: List tenants in property
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"

    post:
      tags: [Step 5 - Tenants]
      summary: Add tenant to a unit
      description: |
        Unit becomes occupied immediately. The unit's rent, water, and electricity
        deposits are charged in full; a deposit of zero is not charged. The move-in month's rent, electricity, and fixed
        water follow the property's `move_in_billing` rule. From the next month on,
        the tenant is billed automatically on the 1st.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"

  /api/tenants:
    get:
      tags: [Step 5 - Tenants]
      summary: List all tenants of the owner
      description: Every tenant across the owner's properties, with balance owed and credit held.
      security:
        - bearerAuth: []
      parameters:
        - name: property_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, notice_given, moved_out, inactive]
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"

  /api/tenants/{tenant_id}:
    get:
      tags: [Step 5 - Tenants]
      summary: Get tenant profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"

    patch:
      tags: [Step 5 - Tenants]
      summary: Update tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"

  /api/tenants/{tenant_id}/move-out:
    post:
      tags: [Step 5 - Tenants]
      summary: Move tenant out
      description: |
        The move-out month is settled by the property's `move_out_billing` rule,
        later charges are voided, and anything overpaid becomes tenant credit.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveOutRequest"
      responses:
        "200":
          description: Tenant moved out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"

  /api/payments:
    get:
      tags: [Step 6 - Payments]
      summary: List owner payments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"

  /api/payments/export:
    get:
      tags: [Step 6 - Payments]
      summary: Export payments as CSV
      description: |
        Returns every matching record as a CSV file. The export is written to
        the audit log. Cells that a spreadsheet would read as a formula are
        neutralised.
      security:
        - bearerAuth: []
      parameters:
        - name: property_id
          in: query
          schema: { type: integer }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /api/payments/stats:
    get:
      tags: [Step 6 - Payments]
      summary: Get payment statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/payments/unmatched:
    get:
      tags: [Step 6 - Payments]
      summary: List unmatched payments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unmatched payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"

  /api/payments/{payment_id}:
    get:
      tags: [Step 6 - Payments]
      summary: Get payment and allocations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/payments/{payment_id}/match:
    post:
      tags: [Step 6 - Payments]
      summary: Manually match unmatched payment to tenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchPaymentRequest"
      responses:
        "200":
          description: Payment matched and allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/payments/{payment_id}/reverse:
    post:
      tags: [Step 6 - Payments]
      summary: Reverse or unassign a matched payment
      description: |
        Takes the money back off every charge the payment settled and removes any
        credit it left. A manually recorded payment stays on record as `reversed`.
        An M-Pesa payment returns to `unmatched` so it can be assigned again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 2
      responses:
        "200":
          description: Payment reversed or unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/tenants/{tenant_id}/payments:
    get:
      tags: [Step 6 - Payments]
      summary: List tenant payments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"

  /api/tenants/{tenant_id}/payments/manual:
    post:
      tags: [Step 6 - Payments]
      summary: Record manual tenant payment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualPaymentRequest"
      responses:
        "201":
          description: Payment recorded and allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/payments/mpesa/sandbox/simulate:
    post:
      tags: [Step 6 - Payments]
      summary: Submit Daraja sandbox simulation
      description: Development/sandbox only. Daraja may accept this request but dispatch the confirmation callback asynchronously.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxSimulationRequest"
      responses:
        "200":
          description: Daraja accepted simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataResponse"

  /api/properties/{property_id}/water-billing-rules:
    put:
      tags: [Step 7 - Water billing]
      summary: Update property water billing rules
