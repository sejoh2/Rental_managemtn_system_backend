          minLength: 40
        notice_period_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30

    DepositDeductionsRequest:
      type: object
      properties:
        deductions:
          type: array
          description: Amounts kept from the rent deposit, such as repainting.
          items:
            type: object
            required: [description, amount]
            properties:
              description: { type: string, example: Repainting }
              amount: { type: number, example: 1000 }

    CreateServiceChargeRequest:
      type: object
      required: [name, category, frequency, amount]
      properties:
        name: { type: string, example: Garbage collection }
        category:
          type: string
          enum: [repairs_maintenance, security, garbage, cleaning, utilities, other]
          description: The expense category this charge recovers.
        frequency:
          type: string
          enum: [monthly, once]
        first_billing:
          type: string
          enum: [now, next_billing]
          default: now
          description: |
            Monthly charges only. `now` bills the tenants living in the
            property for the rest of this month, under the property's
            mid-month rule. `next_billing` bills nobody now; the charge
            starts with the next monthly billing run. A one-off charge is
            always billed now. A tenant who moves in part-way through a
            month is billed one-off charges that day and monthly charges
            from the next monthly billing run.
        amount:
          type: number
          example: 300
          description: Billed to every unit that has no amount of its own.
        unit_amounts:
          type: array
          description: Units that pay a different amount. Zero means the unit is not charged.
          items:
            type: object
            required: [unit_id, amount]
            properties:
              unit_id: { type: integer }
              amount: { type: number, example: 500 }

    UpdateServiceChargeRequest:
      type: object
      description: Provide at least one field.
      properties:
        name: { type: string }
        category:
          type: string
          enum: [repairs_maintenance, security, garbage, cleaning, utilities, other]
        amount: { type: number }
        unit_amounts:
          type: array
          items:
            type: object
            required: [unit_id, amount]
            properties:
              unit_id: { type: integer }
              amount: { type: number }

    CreateExpenseRequest:
      type: object
      required: [category, amount, expense_date]
      properties:
        category:
          type: string
          enum: [repairs_maintenance, security, garbage, cleaning, utilities, other]
        amount: { type: number, example: 2500 }
        expense_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        receipt_url:
          type: string
          format: uri
          nullable: true

    CreateMaintenanceRequest:
      type: object
      required: [title]
      properties:
        unit_id:
          type: integer
          nullable: true
        title: { type: string, example: Leaking kitchen tap }
        description:
          type: string
          nullable: true
        category:
          type: string
          enum: [plumbing, electrical, water, structural, security, cleaning, appliance, other]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        charge_to_tenant:
          type: boolean
          default: false
          description: |
            Who pays, chosen when the issue is reported: false is the owner,
            true is the tenant living in the unit (needs a unit_id). It can
            be changed until the request is resolved with a cost.
        charge_timing:
          type: string
          enum: [now, move_out]
          default: now
          description: See UpdateMaintenanceRequest.

    UpdateMaintenanceRequest:
      type: object
      properties:
        status:
          type: string
          enum: [reported, in_progress, resolved, cancelled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assigned_caretaker_id:
          type: integer
          nullable: true
        assigned_vendor_name:
          type: string
          nullable: true
        estimated_cost:
          type: number
          nullable: true
        actual_cost:
          type: number
          nullable: true
        charge_to_tenant:
          type: boolean
          description: |
            Owner only. When the request is resolved with an actual cost, the
            cost is always recorded as a property expense. If this is true it
            is also charged to the tenant living in the unit. The tenant is
            not told automatically; send the SMS with
            POST /api/maintenance/{request_id}/charge-sms.
            The cost cannot be changed afterwards.
        charge_timing:
          type: string
          enum: [now, move_out]
          description: |
            How the tenant pays a repair charged to them. `now`: the charge
            is open and is paid from the tenant's credit or next payment.
            `move_out`: the charge is recorded with status `held`; it is
            not counted as arrears and nothing pays it during the stay. When
            the tenant moves out it becomes open and the rent deposit covers
            it in the deposit reconciliation. Fixed once the cost is recorded.
        resolution_notes:
          type: string
          nullable: true
        cancellation_reason:
          type: string
          nullable: true

    AssignCaretakerRequest:
      type: object
      required: [phone, first_name, last_name]
      properties:
        phone: { type: string, example: "0712345678" }
        first_name: { type: string, example: Peter }
        last_name: { type: string, example: Mwangi }
        permission_level:
          type: string
          enum: [level_1, level_2]
